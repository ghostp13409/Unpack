[package]
name = "unpack"
version = "0.2.0"
description = "Personal AI-assisted task tracker"
authors = ["Parth Gajjar"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "unpack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_with = "3.24.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
mailparse = "0.18.0"
base64 = "0.23.1"
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "http2", "charset", "system-proxy"] }

[dev-dependencies]
httpmock = "0.9.0"
